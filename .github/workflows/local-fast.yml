
name: Local CI (fast)

on:
  push:
    branches-ignore: ["main"]
  pull_request:

jobs:
  local:
    runs-on: [self-hosted, fedora]
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Create venv
        run: python3 -m venv .venv
      
      - name: Activate venv
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      
      - name: Install deps
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .[dev]

      - name: Run unit tests
        run: pytest -q -m "unit" --maxfail=5 --disable-warnings

      - name: Run integration tests
        run: pytest -q -m "integration" --maxfail=5 --disable-warnings

      - name: Run visualization tests
        run: pytest -q -m "visual" --disable-warnings || true

