
name: Local CI (fast)

on:
  push:
    branches-ignore: ["main"]
  pull_request:

jobs:
  local:
    runs-on: [self-hosted, fedora]
    env:
      MPLBACKEND: Agg

    steps:
      - uses: actions/checkout@v4

      - name: Ensure ANTLR installed
        run: |
          if [ ! -f antlr-4.13.1-complete.jar ]; then
            curl -O https://www.antlr.org/download/antlr-4.13.1-complete.jar
          fi
      
      - name: Generate ANTLR parser
        run: make gen-parser

      - name: Create venv
        run: python3 -m venv .venv
      
      - name: Activate venv
        run: echo "$PWD/.venv/bin" >> $GITHUB_PATH
      
      - name: Install deps
        run: |
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install -e .[dev]

      - name: Run unit tests
        run: pytest -q -m "unit" --disable-warnings --no-header --no-summary || true

      - name: Run integration tests
        run: pytest -q -m "integration" --maxfail=9000 --disable-warnings --no-header --no-summary || true

      - name: Run visualization tests
        run: pytest -q -m "visual" --disable-warnings --maxfail=9000 --no-header --no-summary || true

