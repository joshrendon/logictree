
name: CI

on:
  push:
    branches-ignore: [ "main" ]
  pull_request:
jobs: test: runs-on: ubuntu-latest env: MPLBACKEND: Agg
      DISPLAY: ":99"
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
      fail-fast: false

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz default-jdk

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Cache ANTLR jar
        uses: actions/cache@v4
        with:
          path: antlr-4.13.1-complete.jar
          key: antlr-4.13.1

      - name: Download ANTLR
        if: steps.cache.outputs.cache-hit != 'true'
        run: curl -O https://www.antlr.org/download/antlr-4.13.1-complete.jar

      - name: Generate ANTLR parser
        run: make gen-parser

      - name: Lint (ruff)
        run: ruff check src/ || true

      - name: Add src/ to PYTHONPATH
        run: echo "PYTHONPATH=$PWD/src" >> $GITHUB_ENV

      - name: Print working directory
        run: pwd && ls

      - name: Run fast test set
        run: pytest -q -m "unit or props or diff" --maxfail=10 --durations=15 || true

      #- name: Enforce minimum coverage
      #  run: pytest -q -m "unit or props or diff and not requires_graphviz and not integration" --cov=logictree --cov-report=xml:coverage.xml --cov-report=term --maxfail=50 --disable-warnings || true

      - name: Debug stalled CI
        if: ${{ failure() }}
        run: |
          echo "Dumping running processes..."
          ps aux
          echo "Checking open files..."
          lsof | head -n 40

      - name: Run tests with coverage
        run: pytest -m "unit or integration" --cov=logictree --cov-report=xml:coverage.xml --cov-report=term --maxfail=9000 --disable-warnings -o console_output_style=classic || true
        #run: pytest --cov=logictree --disable-warnings || true

      - name: Generate coverage reports
        run: |
          coverage combine
          coverage report
          coverage xml -o coverage.xml
        #run: |
          #pytest -q -m "unit or props or diff" \
          #  --tb=short \
          #  --cov=logictree \
          #  --cov-fail-under=85 \
          #  --cov-report=html \
          #  --cov-report=xml:coverage.xml \
          #  --cov-report=term-missing \
          #  --maxfail=1 \
          #  --disable-warnings || true

      - name: Check coverage file
        run: ls -lh coverage.xml || (echo "Coverage file missing!" && exit 1)

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          #token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: true

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: htmlcov
          path: htmlcov

      - name: Coverage summary
        if: always()
        run: |
          echo "Coverage summary:"
          grep -A2 "TOTAL" coverage.xml || true
